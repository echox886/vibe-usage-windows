name: CLI upstream drift

# The vendored CLI moves only when a human moves it, and the release workflow
# deliberately never re-vendors. Without this job nothing reports that the
# pinned snapshot has fallen behind upstream — which is how 0.5.12 shipped a
# DSH parser that could not read DeepSeek Harness sessions written weeks earlier.
#
# This job never publishes, never commits, and never re-vendors. It only fails to
# say "a newer reviewed CLI exists and the snapshot needs an upgrade PR". A red
# scheduled run notifies the repository owner, which is the escalation path.

on:
  schedule:
    # Daily, off the hour to avoid the busiest registry minutes.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      check_only:
        description: "Report drift without failing the run"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  drift:
    runs-on: windows-2022
    # Bounded on purpose: this job only reads the registry and the checked-in
    # snapshot, so it must never hold a runner open indefinitely.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # check-version.mjs is the reproducibility gate: pinned version, vendored
      # snapshot, and app version must already agree. Drift is reported separately
      # so a red run always names the right problem.
      - name: Version consistency
        run: node scripts/check-version.mjs

      # --rebuild-verify re-runs the real vendoring path (npm pack of the pinned
      # version + the checked-in Windows patches) inside a throwaway directory and
      # diffs the result against the committed snapshot file by file. Without it
      # the audit only proves that one unpatched file came from upstream; with it
      # the nightly job proves the whole snapshot is reproducible.
      - name: Audit the pinned CLI against upstream
        run: >-
          node scripts/verify-cli-upstream.mjs --rebuild-verify
          ${{ inputs.check_only && '--check-only' || '' }}

      # The DSH regression suite is offline and needs no fixtures from a live
      # machine; it proves the pinned snapshot still reads the current DSH
      # generation. Upstream drift alone must never be the only signal.
      - name: DSH compatibility regression
        run: |
          pnpm install --frozen-lockfile
          pnpm exec vitest run tests/dshCompat.test.ts

      # Opt-in here because it needs the public registry: it proves that a newer
      # upstream release raises a freshness alarm without turning the pinned
      # snapshot's provenance into a failure. This is the one place the split is
      # exercised against a moving channel instead of the frozen pin.
      - name: Provenance survives a newer upstream release
        env:
          VIBE_USAGE_PROVENANCE_SIM: "1"
        run: pnpm exec vitest run tests/cliProvenanceFreshness.test.ts

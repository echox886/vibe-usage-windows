name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Version consistency
        run: node scripts/check-version.mjs

      # Release the reviewed, checked-in CLI snapshot. Pulling npm's moving
      # latest tag here could silently replace the code covered by this build.
      - name: Verify pinned vendored CLI snapshot
        run: node scripts/check-version.mjs

      # Advisory only. A release must stay reproducible, so a newer upstream CLI
      # can never block or alter this build — it is reported so the upgrade PR can
      # be opened deliberately. Reproducibility is unaffected either way.
      - name: Report CLI upstream drift (advisory)
        continue-on-error: true
        run: node scripts/verify-cli-upstream.mjs

      - name: Bundle Node runtime
        run: node scripts/fetch-node.mjs

      - name: Tests
        run: |
          pnpm test
          cargo test --workspace

      - name: Build signed NSIS installer
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ALLOW_UNTRUSTED_SIGNATURE: "true"
          VIBE_USAGE_APP_COMMIT: ${{ github.sha }}
          VIBE_USAGE_APP_BUILD: ${{ github.run_number }}
          VIBE_USAGE_BUILD_KIND: ${{ github.event_name == 'workflow_dispatch' && 'external-test' || 'release' }}
          TAURI_FEATURES: ${{ github.event_name == 'workflow_dispatch' && 'external-test-diagnostics' || '' }}
        run: ./scripts/build-tauri-windows.ps1

      - name: Collect signed artifacts
        id: artifacts
        shell: pwsh
        env:
          SIGNPATH_ALLOW_UNTRUSTED_SIGNATURE: "true"
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $installer = Get-ChildItem -Path "target/release/bundle/nsis" -Filter "*$version*setup.exe" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (-not $installer) {
            throw "NSIS installer not found."
          }

          foreach ($artifact in @($installer.FullName)) {
            $signature = Get-AuthenticodeSignature -FilePath $artifact
            $signatureStatus = $signature.Status.ToString()
            if ($signatureStatus -eq "NotSigned" -or $signatureStatus -eq "HashMismatch") {
              throw "Invalid Authenticode signature for ${artifact}: $($signature.Status). $($signature.StatusMessage)"
            }
            if ($signatureStatus -ne "Valid") {
              $message = "Untrusted Authenticode signature for ${artifact}: $($signature.Status). $($signature.StatusMessage)"
              if ($env:SIGNPATH_ALLOW_UNTRUSTED_SIGNATURE -match '^(1|true|yes|on)$') {
                Write-Warning $message
              } else {
                throw $message
              }
            }
            Write-Host "Verified Authenticode signature: $artifact"
          }

          $dest = "VibeUsage-$version-Windows-Setup.exe"
          Copy-Item $installer.FullName $dest -Force

          node scripts/generate-updater-manifest.mjs $dest
          "installer=$dest" >> $env:GITHUB_OUTPUT

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ steps.artifacts.outputs.installer }}
            latest.json

      # Installer and updater manifest are separate artifacts so testers
      # download a zip containing exactly one obvious .exe.
      - name: Upload installer artifact
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer-external-test
          path: ${{ steps.artifacts.outputs.installer }}

      - name: Upload updater manifest artifact
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v7
        with:
          name: updater-manifest
          path: latest.json

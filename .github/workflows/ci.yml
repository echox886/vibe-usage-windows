name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Version consistency
        run: node scripts/check-version.mjs

      - name: Release wrapper path regression (Windows PowerShell 5.1)
        shell: powershell
        run: ./scripts/test-windows-build-paths.ps1

      - name: Release wrapper path regression (PowerShell 7)
        shell: pwsh
        run: ./scripts/test-windows-build-paths.ps1

      - name: Frontend tests
        run: pnpm test

      - name: Frontend build
        run: pnpm build

      # tauri.windows.conf.json declares resources/node/node.exe as a bundle
      # resource — tauri-build validates its existence even for cargo check.
      - name: Bundle Node runtime
        run: node scripts/fetch-node.mjs

      - name: Rust tests
        run: ./scripts/cargo-windows.ps1 test --workspace

      - name: External-test update isolation
        run: ./scripts/cargo-windows.ps1 test --workspace --features external-test-diagnostics

      - name: Rust check (app)
        run: ./scripts/cargo-windows.ps1 check -p vibe-usage-app
